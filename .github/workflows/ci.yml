name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Catch a breaking goichi release even when nothing here changed.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: build (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: no replace directive
        run: |
          if grep -q '^replace ' go.mod; then
            echo "go.mod still has a replace directive; examples must build against a published version."
            grep '^replace ' go.mod
            exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false
